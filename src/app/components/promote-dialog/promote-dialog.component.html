<div class="panels">

  <!-- Deploy a specific build tag. Which environments appear here comes from
       the backend's deploy-by-tag-envs, so adding one needs no change here. -->
  <div class="panel" *ngIf="actions.deployByTagEnvs.length">
    <h3>Deploy build</h3>
    <div class="row">
      <label>
        Service
        <select [(ngModel)]="deployService" [disabled]="submitting">
          <option *ngFor="let s of services" [value]="s">{{ s }}</option>
        </select>
      </label>

      <label>
        Environment
        <select [(ngModel)]="deployEnv" [disabled]="submitting">
          <option *ngFor="let e of actions.deployByTagEnvs" [value]="e">{{ e | uppercase }}</option>
        </select>
      </label>

      <label class="grow">
        Build tag
        <input type="text" placeholder="e.g. Release.0473ca6"
               [(ngModel)]="deployTag" [disabled]="submitting" />
      </label>

      <button (click)="askDeploy()" [disabled]="!canDeploy">Deploy</button>
    </div>

    <div class="confirm-box" *ngIf="confirming === 'deploy'">
      <p>
        Deploy <strong>{{ deployService }}</strong> build
        <strong>{{ deployTag }}</strong> to
        <strong>{{ deployEnv | uppercase }}</strong>?
      </p>
      <button (click)="confirmDeploy()" [disabled]="submitting">Confirm</button>
      <button class="secondary" (click)="cancel()" [disabled]="submitting">Cancel</button>
    </div>
  </div>

  <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
  <p class="success" *ngIf="successMsg">{{ successMsg }}</p>
</div>
