name: Build and Deploy Builds Dashboard UI

on:
  push:
    branches:
      - 'Release.*'
  workflow_dispatch:

env:
  PROJECT_ID: lictracker-deploy-dashboard
  # Cloud Run moved to Singapore: neither Indian region permits domain mappings.
  REGION: asia-southeast1
  # Artifact Registry stayed in Mumbai — keep the image path valid.
  AR_REGION: asia-south1
  REPO_NAME: builds-dashboard-repo
  IMAGE_NAME: builds-dashboard-ui
  SERVICE_NAME: builds-dashboard-ui

jobs:
  build-and-deploy-builds-dashboard-ui:
    name: Build and Deploy Builds Dashboard UI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate build tag
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TAG="Release.${SHORT_SHA}"
          IMAGE_URI="${AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:${BUILD_TAG}"

          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_TAG=${BUILD_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Build tag: ${BUILD_TAG}"
          echo "Docker image: ${IMAGE_URI}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/298984374646/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@lictracker-deploy-dashboard.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${AR_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        shell: bash
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${BUILD_TAG}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE_URI}" \
            .

          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE_URI}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --service-account="builds-dashboard-ui-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port=8080 \
            --allow-unauthenticated \
            --quiet

      - name: Deploy summary
        shell: bash
        run: |
          {
            echo "## Builds dashboard UI deploy complete"
            echo ""
            echo "- Tag: \`${BUILD_TAG}\`"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Service: \`${SERVICE_NAME}\` (project \`${PROJECT_ID}\`)"
          } >> "$GITHUB_STEP_SUMMARY"